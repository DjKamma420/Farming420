# Brings Hypixel's official SkyBlock resource pack into assets/hypixel-pack/.
#
# The app already reads that directory: src/item-assets.js loads its manifest
# and src/item-art-ui.js paints the textures onto every slot card and item
# editor. Until the directory exists those surfaces fall back to a placeholder,
# so this workflow is the only thing standing between the wiring and the art.
#
# It runs here rather than locally because the sync needs api.hypixel.net and
# resourcepacks.hypixel.net, and it opens a pull request rather than pushing,
# so the pack contents are reviewed before they land.
name: Sync official SkyBlock pack

on:
  workflow_dispatch:
  # A change to the sync machinery should exercise the real network path once,
  # not wait for the next weekly cron. The generated pack branch still opens a
  # reviewable PR and does not push assets straight into the triggering branch.
  push:
    paths:
      - ".github/workflows/sync-pack.yml"
      - "scripts/sync-hypixel-pack.py"
      - "scripts/audit-farming-models.js"
  schedule:
    # Weekly. The pack changes with game updates; a run that finds the same
    # SHA-1 downloads nothing and opens nothing unless the Farming model audit
    # itself changed because Hypixel added/changed a Farming item.
    - cron: "17 5 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-pack
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and extract the current official pack
        run: python3 scripts/sync-hypixel-pack.py

      - name: Audit Farming item model coverage
        run: node scripts/audit-farming-models.js

      - name: Verify what was produced
        run: |
          test -s assets/hypixel-pack/manifest.json
          test -s assets/hypixel-pack/farming-model-audit.json
          test -s assets/hypixel-pack/LICENSE
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          root = Path("assets/hypixel-pack")
          manifest = json.loads((root / "manifest.json").read_text())
          audit = json.loads((root / "farming-model-audit.json").read_text())
          assert manifest["schemaVersion"] == 1, "unexpected manifest schema"
          assert manifest["pack"]["id"] == "SkyBlock", "not the SkyBlock pack"
          assert manifest["pack"]["hash"], "pack carries no hash"
          assert audit["schemaVersion"] == 1, "unexpected Farming model audit schema"
          assert audit["unresolvedCount"] == 0, "Farming model audit still has unresolved items"
          assert audit["resolved"] == audit["totalFarmingPhysicalItems"], "not every Farming physical item resolves"
          items = manifest["items"]
          assert items, "manifest lists no items"

          # Every texture the manifest promises has to actually be on disk, or
          # the app renders a broken image where an item should be.
          missing = [key for key, record in items.items()
                     if not (root / record["texture"]).is_file()]
          assert not missing, f"{len(missing)} manifest entries have no texture file: {missing[:5]}"

          # Every picture the app names has to exist in this manifest. Without
          # this, a renamed or re-filed item silently drops back to a placeholder
          # and nobody finds out until they look at the page.
          data = Path("src/data.js").read_text()
          named = set(re.findall(r'"packAsset":\s*"([^"]+)"', data))
          absent = sorted(name for name in named if name not in items)
          assert not absent, f"src/data.js names pictures this pack does not have: {absent}"

          files = [path for path in root.rglob("*") if path.is_file()]
          total = sum(path.stat().st_size for path in files)
          summary = (
              f"- pack `{manifest['pack']['hash']}`\n"
              f"- {len(items)} pack items, {len(files)} files, {total / 1_048_576:.2f} MB\n"
              f"- {len(named)} pictures named by src/data.js, all present\n"
              f"- {len(manifest.get('ambiguous', {}))} ids dropped as ambiguous\n"
              f"- Farming models: {audit['resolved']}/{audit['totalFarmingPhysicalItems']} resolved; "
              f"{audit['directModelCount']} direct and {audit['fallbackModelCount']} fallback\n"
              f"- Farming model sources: {audit['bySource']}\n"
          )
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("## Official pack sync\n" + summary)
          PY

      - name: Run the repository checks against the synced assets
        run: |
          node scripts/check-sw-manifest.js
          npm test

      - name: Open a pull request when the pack or model audit actually changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain assets/hypixel-pack)" ]; then
            echo "The pack and Farming model audit are unchanged since the last sync; nothing to open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          HASH="$(python3 -c "import json;print(json.load(open('assets/hypixel-pack/manifest.json'))['pack']['hash'][:12])")"
          BRANCH="pack-sync/${HASH}"

          # Written to files rather than passed as long inline arguments, so the
          # message and the body stay readable in this workflow.
          cat > /tmp/commit-message.txt <<MSG
          Sync the official SkyBlock resource pack (${HASH})

          Generated by scripts/sync-hypixel-pack.py from Hypixel's own resource
          endpoint. The archive is verified against the SHA-1 Hypixel publishes
          before anything is extracted. scripts/audit-farming-models.js also
          verifies Farming physical-item model coverage against the current item
          resource, and the pack's own LICENSE is carried alongside the textures.
          MSG
          cat > /tmp/pr-body.md <<BODY
          Adds or updates \`assets/hypixel-pack/\`, which \`src/item-assets.js\` reads and \`src/item-art-ui.js\` paints onto every slot card and item editor.

          Produced by \`scripts/sync-hypixel-pack.py\`: the pack is resolved from Hypixel's own resource endpoint, the archive is checked against the SHA-1 Hypixel publishes before anything is extracted, and the pack's \`LICENSE\` is carried alongside the textures. \`scripts/audit-farming-models.js\` then compares the current Hypixel item resource with the actual runtime model resolver and writes \`farming-model-audit.json\`. The sync fails if a Farming armor/equipment/tool/Vacuum item has no usable head, exact pack model, set fallback, or vanilla material model.

          The run summary includes the pack count and Farming model-source coverage. Nothing in \`src/\` changes.
          BODY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add assets/hypixel-pack
          git commit -F /tmp/commit-message.txt

          # The branch name is the pack hash, so a re-run for the same pack meets
          # the branch the previous run left behind. A shallow CI checkout knows
          # nothing about it, and --force-with-lease refuses a ref it has never
          # seen ("stale info"); fetching it first gives the lease its base.
          git fetch origin "$BRANCH" || true
          git push --force-with-lease origin "$BRANCH"

          # A re-run for the same pack hash updates the branch instead of
          # stacking a second pull request on top of the first.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create \
              --base "${{ github.ref_name }}" \
              --head "$BRANCH" \
              --title "Sync the official SkyBlock resource pack (${HASH})" \
              --body-file /tmp/pr-body.md
          fi
