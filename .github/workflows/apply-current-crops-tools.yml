name: Apply current crops and farming tools

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/patch_current_crops_tools.py"
      - ".github/workflows/apply-current-crops-tools.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch current crop and tool model
        run: python3 scripts/patch_current_crops_tools.py
      - name: Validate app
        run: |
          node --check src/app.js
          node --check src/data.js
          node --check src/enhancements.js
      - name: Commit current crop and tool model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js src/data.js
          git diff --cached --quiet && exit 0
          git commit -m "Add 13 crops and physical farming tool progress"
          git push
