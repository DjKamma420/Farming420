# Bootstrap helper: expands the uploaded prototype into the repository.
name: Bootstrap Farming420 app

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bootstrap.yml"
      - "skyblock-farming-maxer.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app into repository root
        run: |
          rm -rf .bootstrap
          mkdir .bootstrap
          unzip -q skyblock-farming-maxer.zip -d .bootstrap
          rsync -a --exclude='.git/' --exclude='.github/workflows/' .bootstrap/skyblock-farming-maxer/ ./
          rm -rf .bootstrap skyblock-farming-maxer.zip
      - name: Commit unpacked app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Unpack Farming420 web app"
          git push
