name: Apply English foundation

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/patch_english_foundation.py"
      - ".github/workflows/apply-english-foundation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch runtime
        run: python3 scripts/patch_english_foundation.py
      - name: Validate JavaScript
        run: |
          node --check src/app.js
          node --check src/data.js
          node --check src/enhancements.js
          node --check src/config.js
          node --check src/hypixel-import.js
          node --check src/foundation.js
      - name: Commit runtime foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Convert runtime to English and versioned state"
          git push
