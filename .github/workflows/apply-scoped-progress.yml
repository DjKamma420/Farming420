name: Apply scoped crop progress

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/patch_scoped_progress.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch app state model
        run: python3 scripts/patch_scoped_progress.py
      - name: Validate app
        run: |
          node --check src/app.js
          node --check src/data.js
          node --check src/enhancements.js
      - name: Commit scoped progress model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Scope crop and tool progress per crop"
          git push
