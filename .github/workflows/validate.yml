name: Validate Farming420

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate JavaScript syntax
        run: |
          for file in src/*.js tests/*.js proxy/*.js scripts/*.js sw.js; do
            node --check "$file"
          done

      - name: Check required app files
        run: |
          for file in index.html manifest.webmanifest sw.js package.json \
                      src/app.js src/config.js src/data.js src/migrations.js src/backup.js \
                      src/enhancements.js src/foundation.js src/hypixel-import.js \
                      src/nbt.js src/item-normalizer.js src/profile-items.js \
                      src/profile-normalizer.js src/profile-sync.js src/scopes.js \
                      src/credentials.js src/hypixel-client.js src/live-sync.js src/snapshot-apply.js src/help-locations.js \
                      src/setups.js src/item-catalog.js src/progression.js \
                      proxy/hypixel-proxy.js proxy/README.md \
                      src/styles.css src/enhancements.css src/foundation.css \
                      assets/icon.svg \
                      AGENTS.md README.md \
                      docs/PRODUCT_SPEC.md docs/PROFILE_DATA_MATRIX.md docs/PROFILE_MODEL.md docs/MATH_MODEL.md docs/FINDING_VALUES.md \
                      docs/VERIFIED_MECHANICS.md docs/FARMING_HISTORY.md; do
            test -f "$file" || { echo "missing required file: $file"; exit 1; }
          done

      - name: Check the service worker caches every shipped app file
        run: node scripts/check-sw-manifest.js

      - name: Run tests
        run: npm test
