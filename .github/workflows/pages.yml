name: Deploy Farming420 to GitHub Pages

on:
  workflow_run:
    workflows: ["Validate Farming420"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: farming420-pages
  cancel-in-progress: false

jobs:
  deploy:
    # A successful PR check or a fork must never acquire publishing authority.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify validated immutable source
        run: test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
      - uses: actions/configure-pages@v5
      - name: Stamp deployment build
        env:
          BUILD_ID: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/prepare-pages-deploy.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
