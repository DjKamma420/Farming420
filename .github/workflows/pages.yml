name: Deploy Farming420 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Only the newest stamped build matters. The repository is also configured
  # for GitHub's branch-based Pages publisher, which runs in parallel and
  # normally finishes after this custom workflow. Keep this workflow separate
  # and let a newer push replace an older waiting stamped deployment.
  group: farming420-stamped-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp deployment build
        env:
          BUILD_ID: ${{ github.sha }}
        run: node scripts/prepare-pages-deploy.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for branch Pages publisher
        run: sleep 70
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
