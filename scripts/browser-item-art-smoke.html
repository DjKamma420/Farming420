<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Farming420 item art smoke</title></head>
<body>
<pre id="verdict">ITEM_ART_PENDING</pre>
<script type="module">
  /**
   * An item portrait must never end up empty.
   *
   * `item-art-coverage.js` places art in a card's portrait box and marks the
   * box as filled. When a player-head texture failed to load, the old code
   * deleted the art node and left the marks in place -- an empty 42x42 hole,
   * styled as though it held an icon, that no later pass would fill because the
   * box still claimed to be done.
   *
   * Measured on Accessories with a seeded catalog: all 22 cards received art,
   * then 18 of them drained away over ~1.3 s as the texture requests failed.
   * That is not an exotic path in an offline-capable PWA; offline it is every
   * card, and online it is any card whose texture request is blocked or slow.
   *
   * The seed below includes one item with a well-formed head-texture hash that
   * does not exist, so the failure path runs on every build instead of only
   * when the network misbehaves -- otherwise this check would quietly pass on a
   * runner with working DNS while the bug was still there.
   */

  import { CATALOG_STORAGE_KEY } from '../src/item-catalog.js';
  import { DATA_SCHEMA_VERSION, STORAGE_KEY } from '../src/config.js';

  const SETTLE_MS = 80;

  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    schemaVersion: DATA_SCHEMA_VERSION,
    page: 'dashboard',
    selectedCrop: 'melon',
    search: '',
    drawer: null,
    profile: {
      name: 'Item art smoke',
      globalFortune: 0,
      cropFortune: {},
      cropProgress: {},
      toolProgress: {},
      levels: {},
      owned: {},
      costs: {},
      manualGain: {},
    },
  }));

  // The coverage pass returns early on an empty catalog, so it needs entries to
  // run at all. These are cached rather than fetched, so no Hypixel request is
  // made; the head textures the app then derives from its own verified id table
  // are the only thing that touches the network, and the assertion below is
  // deliberately indifferent to whether they arrive.
  const entry = (id, name, category, material) => ({
    id, name, category, tier: 'LEGENDARY', material,
    skin: null, color: null, gemstoneSlots: [], cannotReforge: false, canRecombobulate: true,
  });
  localStorage.setItem(CATALOG_STORAGE_KEY, JSON.stringify({
    fetchedAt: new Date().toISOString(),
    items: [
      entry('FERMENTO_HELMET', 'Fermento Helmet', 'HELMET', 'LEATHER_HELMET'),
      entry('LOTUS_NECKLACE', 'Lotus Necklace', 'NECKLACE', 'SKULL_ITEM'),
      entry('PESTHUNTERS_CLOAK', 'Pesthunter’s Cloak', 'CLOAK', 'SKULL_ITEM'),
      entry('ENCHANTED_JACK_O_LANTERN', 'Enchanted Jack o’ Lantern', 'ACCESSORY', 'JACK_O_LANTERN'),
      // A head texture that is guaranteed not to load, so the failure path runs
      // on every build rather than only when the network misbehaves. The hash is
      // well-formed, so `skinTextureUrl` builds a real URL from it; it simply
      // does not exist. Reachable host or not, the image errors -- which is the
      // point: on a runner with working DNS the old bug would otherwise hide.
      { ...entry('ANITA_TALISMAN', 'Anita’s Talisman', 'ACCESSORY', 'SKULL_ITEM'),
        skin: '00000000000000000000000000000000' },
    ],
  }));

  const out = document.querySelector('#verdict');
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  const frame = document.createElement('iframe');
  frame.width = '1280';
  frame.height = '1000';
  frame.src = '../';
  document.body.appendChild(frame);

  try {
    await new Promise((resolve, reject) => {
      frame.addEventListener('load', resolve, { once: true });
      frame.addEventListener('error', () => reject(new Error('the app iframe failed to load')), { once: true });
    });
    const doc = frame.contentDocument;

    // Reach Accessories by clicking, the way a player does. A cold load
    // straight onto the page places the art but leaves the containers
    // unstamped, so seeding `page: 'accessories'` would measure a different
    // code path from the one the bug lived in -- and report zero containers.
    for (let i = 0; i < 40 && !doc.querySelector('.sidebar [data-page]'); i++) await wait(SETTLE_MS);
    doc.querySelector('.sidebar [data-page="accessories"]')?.click();

    for (let i = 0; i < 40 && !doc.querySelector('.card-portrait'); i++) await wait(SETTLE_MS);
    // Let every texture request settle -- success or failure -- before counting.
    await wait(SETTLE_MS * 20);

    // The portrait box is what a player looks at, and an empty one is the whole
    // defect. `data-coverage-art` looked like the natural unit and is not: a
    // cold load places art through a path that never stamps, so counting stamps
    // reported zero containers on a page showing twenty-two icons.
    const portraits = [...doc.querySelectorAll('.card-portrait')];
    const empty = portraits.filter(node => !node.querySelector('.coverage-item-art, .official-item-art, .skull-art, .item-art-fallback'));

    out.textContent = empty.length
      ? `ITEM_ART_EMPTY portraits=${portraits.length} empty=${empty.length}\n`
        + empty.slice(0, 8).map(node => node.className).join('\n')
      : `ITEM_ART_OK portraits=${portraits.length}`;
  } catch (error) {
    out.textContent = `ITEM_ART_ERROR ${error && error.message ? error.message : String(error)}`;
  }
</script>
</body>
</html>
