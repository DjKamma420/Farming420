<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Farming420 idempotence smoke</title></head>
<body>
<pre id="verdict">IDEMPOTENCE_PENDING</pre>
<script type="module">
  /**
   * The invariant in docs/RENDER_FREEZE_SAFETY.md, checked instead of trusted.
   *
   * "Applying the same UI state twice must converge to a no-op." Twenty-five
   * MutationObserver modules patch a subtree they are themselves watching, so an
   * enhancer that writes unconditionally wakes itself forever. That is the shape
   * that froze the app in PR #90, and until now the rule was enforced by review
   * and by hand-driving a browser -- which is exactly how the dashboard guide
   * stayed silently dead for four days.
   *
   * The app runs in an iframe rather than in this document, because the check
   * needs to outlive the app's boot and keep driving it. Same origin, so this
   * page can read the iframe's DOM directly; the verdict is written here, where
   * `--dump-dom` will capture it.
   *
   * Timers are cheap under `--virtual-time-budget`, but not free: every wait
   * below is spent from that budget, so they are kept short and the shell hands
   * this harness a larger budget than the plain startup dump.
   */
  import { DATA_SCHEMA_VERSION, STORAGE_KEY } from '../src/config.js';
  import { CATALOG_STORAGE_KEY } from '../src/item-catalog.js';

  const SETTLE_MS = 60;
  const REAPPLY_PASSES = 3;

  // A profile with real content. An empty one renders far fewer branches, and a
  // non-idempotent writer usually lives in a branch that only filled data takes.
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    schemaVersion: DATA_SCHEMA_VERSION,
    page: 'dashboard',
    selectedCrop: 'melon',
    search: '',
    drawer: null,
    profile: {
      name: 'Idempotence smoke',
      globalFortune: 900,
      cropFortune: { melon: 420 },
      cropProgress: {},
      toolProgress: {
        'melon-dicer': {
          levels: { 'tool-mk-ii': 1, 'tool-enchant-dedication': 4 },
          owned: { 'tool-mk-ii': true },
          costs: {},
          manualGain: {},
        },
      },
      levels: { 'account-skill-farming-skill-level': 45 },
      owned: {},
      costs: {},
      manualGain: {},
      setups: {
        modelVersion: 1,
        activeId: 'normal',
        list: [{
          id: 'normal',
          name: 'Normal Farming',
          slots: {
            helmet: {
              skyblockId: 'FERMENTO_HELMET',
              displayName: 'Fermento Helmet',
              rarity: 'LEGENDARY',
              rarityBasis: 'base',
              reforge: 'mossy',
              enchantments: { pesterminator: 6 },
              gems: [],
              recombobulated: true,
              skullTexture: null,
              source: 'manual',
              itemUuid: null,
            },
            chestplate: null, leggings: null, boots: null,
            equipment1: null, equipment2: null, equipment3: null, equipment4: null,
            pet: null, petItem: null,
          },
        }],
      },
    },
  }));

  // Offline and deterministic: a fresh empty catalog keeps the app from
  // reaching Hypixel while every page is driven.
  localStorage.setItem(CATALOG_STORAGE_KEY, JSON.stringify({
    fetchedAt: new Date().toISOString(),
    items: [],
  }));

  const out = document.querySelector('#verdict');
  const report = text => { out.textContent = text; };
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  const frame = document.createElement('iframe');
  frame.width = '1280';
  frame.height = '1000';
  frame.src = '../';
  document.body.appendChild(frame);

  try {
    await new Promise((resolve, reject) => {
      frame.addEventListener('load', resolve, { once: true });
      frame.addEventListener('error', () => reject(new Error('the app iframe failed to load')), { once: true });
    });

    const doc = frame.contentDocument;
    const win = frame.contentWindow;

    // Wait for the shell, then for the enhancement layer to finish its first
    // pass. A measurement taken mid-boot would report drift that is just the
    // app still starting.
    for (let i = 0; i < 40 && !doc.querySelector('.sidebar [data-page]'); i++) await wait(SETTLE_MS);
    await wait(SETTLE_MS * 3);

    const pages = [...doc.querySelectorAll('.sidebar [data-page]')].map(node => node.dataset.page);
    if (pages.length === 0) throw new Error('no navigable pages found; the harness tested nothing');

    const measure = () => {
      const app = doc.querySelector('#app');
      if (!app) throw new Error('#app disappeared');
      return { nodes: app.querySelectorAll('*').length, chars: app.innerHTML.length };
    };

    const drifted = [];
    for (const page of pages) {
      doc.querySelector(`.sidebar [data-page="${page}"]`)?.click();
      await wait(SETTLE_MS * 2);

      const before = measure();
      // Re-announce the *same* state. Nothing changed, so nothing may change.
      for (let pass = 0; pass < REAPPLY_PASSES; pass++) {
        win.dispatchEvent(new win.Event('farming420:state-changed'));
        await wait(SETTLE_MS);
      }
      const after = measure();

      if (after.nodes !== before.nodes || after.chars !== before.chars) {
        drifted.push(`${page}: nodes ${before.nodes}->${after.nodes}, chars ${before.chars}->${after.chars}`);
      }
    }

    report(drifted.length
      ? `IDEMPOTENCE_DRIFT pages=${pages.length}\n${drifted.join('\n')}`
      : `IDEMPOTENCE_OK pages=${pages.length}`);
  } catch (error) {
    report(`IDEMPOTENCE_ERROR ${error && error.message ? error.message : String(error)}`);
  }
</script>
</body>
</html>
