<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Farming420 tool scroll smoke</title></head>
<body>
<pre id="verdict">TOOL_SCROLL_PENDING</pre>
<script type="module">
  import { DATA_SCHEMA_VERSION, STORAGE_KEY } from '../src/config.js';
  import { CATALOG_STORAGE_KEY } from '../src/item-catalog.js';

  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  const out = document.querySelector('#verdict');
  const report = text => { out.textContent = text; };

  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    schemaVersion: DATA_SCHEMA_VERSION,
    page: 'tools',
    selectedCrop: 'melon',
    search: '',
    drawer: null,
    profile: {
      name: 'Tool scroll smoke',
      globalFortune: 0,
      cropFortune: {},
      cropProgress: {},
      toolProgress: {
        'melon-dicer': { levels: {}, owned: {}, costs: {}, manualGain: {} },
        'fungi-cutter': { levels: {}, owned: {}, costs: {}, manualGain: {} },
      },
      levels: {},
      owned: {},
      costs: {},
      manualGain: {},
    },
  }));
  localStorage.setItem(CATALOG_STORAGE_KEY, JSON.stringify({
    fetchedAt: new Date().toISOString(),
    items: [],
  }));

  const frame = document.createElement('iframe');
  frame.width = '412';
  frame.height = '840';
  frame.src = '../';
  document.body.appendChild(frame);

  try {
    await new Promise((resolve, reject) => {
      frame.addEventListener('load', resolve, { once: true });
      frame.addEventListener('error', () => reject(new Error('app iframe failed to load')), { once: true });
    });

    const doc = frame.contentDocument;
    const win = frame.contentWindow;
    for (let i = 0; i < 80 && !doc.querySelector('.sb-tool-card[data-sb-tool-crop="mushroom"]'); i++) await wait(50);
    await wait(250);

    const selected = doc.querySelector('.sb-tool-card.selected[data-sb-tool-crop="melon"]');
    const target = doc.querySelector('.sb-tool-card[data-sb-tool-crop="mushroom"]');
    const editor = doc.querySelector('.sb-tool-grid > .sb-docked-editor:not(.sb-tool-editor-collapsed)');
    if (!selected || !target || !editor) throw new Error('expanded Melon tool accordion was not ready');

    target.scrollIntoView({ block: 'center' });
    await wait(100);
    const main = doc.querySelector('.main');
    if (!main) throw new Error('main scroll container is missing');
    const beforeTop = target.getBoundingClientRect().top;
    const beforeY = main.scrollTop;

    target.click();
    for (let i = 0; i < 80; i++) {
      await wait(50);
      const next = doc.querySelector('.sb-tool-card.selected[data-sb-tool-crop="mushroom"]');
      if (next && next.nextElementSibling?.matches?.('.sb-docked-editor:not(.sb-tool-editor-collapsed)')) break;
    }
    await wait(250);

    const after = doc.querySelector('.sb-tool-card.selected[data-sb-tool-crop="mushroom"]');
    if (!after) throw new Error('Fungi Cutter was not selected');
    const nextMain = doc.querySelector('.main');
    if (!nextMain) throw new Error('main scroll container disappeared after tool switch');
    const afterTop = after.getBoundingClientRect().top;
    const afterY = nextMain.scrollTop;
    const maxY = Math.max(0, nextMain.scrollHeight - nextMain.clientHeight);
    const drift = Math.abs(afterTop - beforeTop);
    const bottomGap = Math.abs(maxY - afterY);

    report(drift <= 4 && bottomGap > 4
      ? `TOOL_SCROLL_OK drift=${drift.toFixed(2)} beforeTop=${beforeTop.toFixed(2)} afterTop=${afterTop.toFixed(2)} beforeY=${beforeY.toFixed(2)} afterY=${afterY.toFixed(2)} maxY=${maxY.toFixed(2)}`
      : `TOOL_SCROLL_DRIFT drift=${drift.toFixed(2)} beforeTop=${beforeTop.toFixed(2)} afterTop=${afterTop.toFixed(2)} beforeY=${beforeY.toFixed(2)} afterY=${afterY.toFixed(2)} maxY=${maxY.toFixed(2)} bottomGap=${bottomGap.toFixed(2)}`);
  } catch (error) {
    report(`TOOL_SCROLL_ERROR ${error?.message || String(error)}`);
  }
</script>
</body>
</html>
